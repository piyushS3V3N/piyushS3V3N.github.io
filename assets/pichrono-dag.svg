<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" style="background-color: #1e1e1e; font-family: monospace; border-radius: 8px;">
  <!-- Title -->
  <text x="20" y="30" fill="#888" font-size="14" font-weight="bold">pichrono serve (localhost:8080)</text>
  <line x1="0" y1="45" x2="800" y2="45" stroke="#333" stroke-width="1" />

  <!-- Paths -->
  <!-- Main branch line -->
  <line x1="80" y1="150" x2="180" y2="150" stroke="#555" stroke-width="2" />
  <line x1="220" y1="150" x2="320" y2="150" stroke="#555" stroke-width="2" />
  
  <!-- Feature branch divergence -->
  <path d="M 220 150 C 260 150, 260 80, 320 80" stroke="#555" stroke-width="2" fill="none" />
  <line x1="360" y1="80" x2="460" y2="80" stroke="#555" stroke-width="2" />
  <line x1="500" y1="80" x2="600" y2="80" stroke="#555" stroke-width="2" />
  
  <!-- Doomsday branch divergence -->
  <path d="M 360 150 C 400 150, 400 230, 460 230" stroke="#555" stroke-width="2" fill="none" />
  
  <!-- Merge back to main -->
  <path d="M 640 80 C 700 80, 700 150, 740 150" stroke="#555" stroke-width="2" fill="none" stroke-dasharray="5,5"/>

  <!-- Commits -->
  <!-- Initial -->
  <circle cx="60" cy="150" r="20" fill="#4CAF50" stroke="#fff" stroke-width="2" />
  <text x="60" y="155" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">a1b2</text>
  <text x="60" y="190" fill="#ccc" font-size="11" text-anchor="middle">init</text>

  <!-- Second -->
  <circle cx="200" cy="150" r="20" fill="#2196F3" stroke="#fff" stroke-width="2" />
  <text x="200" y="155" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">c3d4</text>
  <text x="200" y="190" fill="#ccc" font-size="11" text-anchor="middle">add files</text>
  <rect x="175" y="200" width="50" height="20" rx="4" fill="#666" />
  <text x="200" y="214" fill="#fff" font-size="10" text-anchor="middle">main</text>

  <!-- Main progressing -->
  <circle cx="340" cy="150" r="20" fill="#2196F3" />
  <text x="340" y="155" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">e5f6</text>
  <text x="340" y="190" fill="#ccc" font-size="11" text-anchor="middle">fix bug</text>

  <!-- Feature branch 1 -->
  <circle cx="340" cy="80" r="20" fill="#9C27B0" stroke="#fff" stroke-width="2" />
  <text x="340" y="85" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">g7h8</text>
  <text x="340" y="50" fill="#ccc" font-size="11" text-anchor="middle">new API</text>

  <!-- Feature branch 2 -->
  <circle cx="480" cy="80" r="20" fill="#9C27B0" stroke="#fff" stroke-width="2" />
  <text x="480" y="85" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">i9j0</text>
  <text x="480" y="50" fill="#ccc" font-size="11" text-anchor="middle">update docs</text>
  <rect x="445" y="15" width="70" height="20" rx="4" fill="#666" />
  <text x="480" y="29" fill="#fff" font-size="10" text-anchor="middle">feature-dev</text>

  <!-- Feature branch 3 -->
  <circle cx="620" cy="80" r="20" fill="#9C27B0" stroke="#fff" stroke-width="2" />
  <text x="620" y="85" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">k1l2</text>
  <text x="620" y="50" fill="#ccc" font-size="11" text-anchor="middle">tests</text>

  <!-- Doomsday recovered commit -->
  <circle cx="480" cy="230" r="20" fill="#FF5722" stroke="#fff" stroke-width="2" stroke-dasharray="2,2"/>
  <text x="480" y="235" fill="#fff" font-size="12" text-anchor="middle" font-weight="bold">m3n4</text>
  <text x="480" y="270" fill="#ccc" font-size="11" text-anchor="middle">lost commit</text>
  <rect x="430" y="280" width="100" height="20" rx="4" fill="#D32F2F" />
  <text x="480" y="294" fill="#fff" font-size="10" text-anchor="middle">doomsday-recovery</text>

  <!-- Final merge point (unmerged) -->
  <circle cx="760" cy="150" r="20" fill="#555" stroke="#888" stroke-width="2" stroke-dasharray="2,2" />
  <text x="760" y="155" fill="#aaa" font-size="12" text-anchor="middle">?</text>
  <text x="760" y="190" fill="#888" font-size="11" text-anchor="middle">merge</text>
</svg>
