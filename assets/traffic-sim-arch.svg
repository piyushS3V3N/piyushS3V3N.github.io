<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" style="background-color: #f4f6f9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.1" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#667085" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="40" fill="#101828" font-size="20" font-weight="bold" text-anchor="middle">Traffic Simulator Architecture</text>

  <!-- PyQt5 GUI Layer -->
  <rect x="50" y="80" width="700" height="320" rx="12" fill="#ffffff" stroke="#eaecf0" stroke-width="2" filter="url(#shadow)" />
  <text x="70" y="110" fill="#344054" font-size="16" font-weight="bold">PyQt5 Application Layer</text>

  <!-- Control Panel -->
  <rect x="80" y="140" width="200" height="230" rx="8" fill="#fcfcfd" stroke="#d0d5dd" stroke-width="2" stroke-dasharray="4,4" />
  <text x="180" y="170" fill="#475467" font-size="14" font-weight="bold" text-anchor="middle">Control Panel (UI)</text>
  
  <rect x="100" y="200" width="160" height="30" rx="4" fill="#1570ef" />
  <text x="180" y="220" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Start Simulation</text>
  
  <rect x="100" y="250" width="160" height="30" rx="4" fill="#f2f4f7" stroke="#d0d5dd" />
  <text x="180" y="270" fill="#344054" font-size="12" text-anchor="middle">Status: Running</text>
  
  <rect x="100" y="300" width="160" height="15" rx="7.5" fill="#f2f4f7" stroke="#d0d5dd" />
  <rect x="100" y="300" width="100" height="15" rx="7.5" fill="#12b76a" />

  <!-- Data Layer -->
  <rect x="330" y="140" width="380" height="80" rx="8" fill="#fcfcfd" stroke="#d0d5dd" stroke-width="2" />
  <text x="520" y="170" fill="#475467" font-size="14" font-weight="bold" text-anchor="middle">Geospatial Data Processing</text>
  <rect x="350" y="185" width="150" height="25" rx="4" fill="#e0f2fe" stroke="#7dd3fc" />
  <text x="425" y="202" fill="#0369a1" font-size="12" font-weight="bold" text-anchor="middle">OSMnx (Map Data)</text>
  <rect x="530" y="185" width="150" height="25" rx="4" fill="#e0f2fe" stroke="#7dd3fc" />
  <text x="605" y="202" fill="#0369a1" font-size="12" font-weight="bold" text-anchor="middle">NetworkX (Routing)</text>

  <!-- Rendering Layer -->
  <rect x="330" y="260" width="380" height="110" rx="8" fill="#1e293b" filter="url(#shadow)" />
  <text x="520" y="290" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">SimulationWidget (QOpenGLWidget)</text>
  
  <rect x="350" y="320" width="150" height="30" rx="4" fill="#334155" stroke="#475569" />
  <text x="425" y="340" fill="#cbd5e1" font-size="12" font-weight="bold" text-anchor="middle">OpenGL Rendering</text>
  
  <rect x="530" y="320" width="150" height="30" rx="4" fill="#334155" stroke="#475569" />
  <text x="605" y="340" fill="#cbd5e1" font-size="12" font-weight="bold" text-anchor="middle">MetalGPU (macOS)</text>

  <!-- Arrows -->
  <line x1="280" y1="200" x2="330" y2="200" stroke="#667085" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="280" y1="315" x2="330" y2="315" stroke="#667085" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="520" y1="220" x2="520" y2="260" stroke="#667085" stroke-width="2" marker-end="url(#arrow)" />

</svg>
