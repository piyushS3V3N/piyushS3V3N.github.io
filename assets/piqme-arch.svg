<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" style="background-color: #ffffff; font-family: Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
    </marker>
  </defs>

  <!-- Alice -->
  <rect x="50" y="50" width="160" height="60" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" filter="url(#shadow)" />
  <text x="130" y="80" fill="#000" font-size="14" font-weight="bold" text-anchor="middle">Alice</text>
  <text x="130" y="98" fill="#333" font-size="11" text-anchor="middle">(CSIDH Public Key)</text>

  <!-- Bob -->
  <rect x="590" y="50" width="160" height="60" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2" filter="url(#shadow)" />
  <text x="670" y="80" fill="#000" font-size="14" font-weight="bold" text-anchor="middle">Bob</text>
  <text x="670" y="98" fill="#333" font-size="11" text-anchor="middle">(CSIDH Public Key)</text>

  <!-- Key Exchange Hub -->
  <rect x="320" y="50" width="160" height="60" rx="8" fill="#fff2cc" stroke="#d6b656" stroke-width="2" filter="url(#shadow)" />
  <text x="400" y="85" fill="#000" font-size="14" font-weight="bold" text-anchor="middle">Key Exchange</text>

  <!-- Shared Secret -->
  <rect x="320" y="160" width="160" height="50" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2" filter="url(#shadow)" />
  <text x="400" y="190" fill="#000" font-size="14" font-weight="bold" text-anchor="middle">Shared Secret Key</text>

  <!-- ChaCha20 Engine -->
  <rect x="300" y="260" width="200" height="80" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="2" filter="url(#shadow)" />
  <text x="400" y="295" fill="#000" font-size="14" font-weight="bold" text-anchor="middle">ChaCha20 Engine</text>
  <text x="400" y="315" fill="#333" font-size="11" text-anchor="middle">(Massive Parallel Encryption)</text>

  <!-- Ciphertext -->
  <path d="M 600 260 L 730 260 L 730 330 L 600 330 Z" fill="#e1d5e7" stroke="#9673a6" stroke-width="2" filter="url(#shadow)" />
  <path d="M 730 260 L 750 280 L 750 330 L 730 330" fill="none" stroke="#9673a6" stroke-width="2" />
  <path d="M 730 260 L 730 280 L 750 280" fill="none" stroke="#9673a6" stroke-width="2" />
  <text x="670" y="300" fill="#000" font-size="14" font-weight="bold" text-anchor="middle">Ciphertext</text>

  <!-- Plaintext -->
  <path d="M 50 260 L 180 260 L 180 330 L 50 330 Z" fill="#e1d5e7" stroke="#9673a6" stroke-width="2" filter="url(#shadow)" />
  <path d="M 180 260 L 200 280 L 200 330 L 180 330" fill="none" stroke="#9673a6" stroke-width="2" />
  <path d="M 180 260 L 180 280 L 200 280" fill="none" stroke="#9673a6" stroke-width="2" />
  <text x="120" y="300" fill="#000" font-size="14" font-weight="bold" text-anchor="middle">Plaintext</text>

  <!-- Arrows -->
  <line x1="210" y1="80" x2="310" y2="80" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="590" y1="80" x2="490" y2="80" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="400" y1="110" x2="400" y2="150" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="400" y1="210" x2="400" y2="250" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="205" y1="300" x2="290" y2="300" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="505" y1="300" x2="590" y2="300" stroke="#000" stroke-width="2" marker-end="url(#arrow)" />

</svg>
